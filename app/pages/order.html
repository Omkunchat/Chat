<div id="orders-container-wrapper" class="w-full max-w-[95rem] mx-auto space-y-6 animate-fade-in pb-24 relative font-sans">

    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
        <div class="flex items-center gap-4">
            <button onclick="window.location.hash='#inbox'" class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-500 hover:bg-blue-50 hover:text-blue-600 flex items-center justify-center transition-all active:scale-95 border border-slate-200">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div>
                <h2 class="text-2xl font-black text-slate-900 tracking-tighter">Order Management</h2>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Control your sales, pickups & appointments</p>
            </div>
        </div>
        <div class="flex items-center gap-2 px-4 py-2 bg-blue-50 text-blue-700 rounded-xl border border-blue-100">
            <i class="fa-solid fa-circle-check text-[10px]"></i>
            <span class="text-[10px] font-black uppercase tracking-widest">Auto-WhatsApp notifications active</span>
        </div>
    </div>

    <div class="flex flex-col xl:flex-row justify-between items-center gap-4 bg-white p-4 rounded-[2rem] border border-slate-100 shadow-sm">
        <div class="relative w-full xl:w-96">
            <i class="fas fa-search absolute left-5 top-4 text-slate-300 text-xs"></i>
            <input type="text" id="order-search" onkeyup="window.searchOrders()" placeholder="SEARCH BY NAME, PHONE, OR ID..." 
                class="w-full pl-12 pr-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-[11px] font-black uppercase tracking-wider outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50 transition-all shadow-inner placeholder:text-slate-400">
        </div>

        <div class="flex overflow-x-auto hide-scrollbar bg-slate-100 p-1.5 rounded-2xl w-full xl:w-auto" id="order-filters">
            <button onclick="window.setOrderFilter('all')" class="flex-1 md:flex-none px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest bg-slate-900 text-white shadow-lg transition-all filter-btn whitespace-nowrap" data-filter="all">All Jobs</button>
            <button onclick="window.setOrderFilter('Processing')" class="flex-1 md:flex-none px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 transition-all filter-btn whitespace-nowrap" data-filter="Processing">Processing</button>
            <button onclick="window.setOrderFilter('Dispatched')" class="flex-1 md:flex-none px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 transition-all filter-btn whitespace-nowrap" data-filter="Dispatched">Dispatched</button>
            <button onclick="window.setOrderFilter('Delivered')" class="flex-1 md:flex-none px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-500 hover:text-slate-800 transition-all filter-btn whitespace-nowrap" data-filter="Delivered">Delivered</button>
        </div>
    </div>

    <div id="orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 min-h-[500px] items-start">
        <div class="col-span-full flex flex-col items-center justify-center py-32 text-slate-400 bg-white rounded-[2rem] border border-dashed border-slate-200">
            <i class="fas fa-circle-notch fa-spin text-3xl mb-4 text-blue-500"></i>
            <p class="text-[11px] font-black uppercase tracking-widest">Syncing Orders...</p>
        </div>
    </div>

    <div id="history-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-md z-[9999] flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col max-h-[85vh] border border-slate-100 transform transition-all animate-in fade-in zoom-in duration-300">
            <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="font-black text-slate-800 text-sm uppercase tracking-widest flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-blue-500"></i> Order History
                </h3>
                <button onclick="window.closeHistoryModal()" class="text-slate-400 hover:bg-slate-200 w-9 h-9 flex items-center justify-center rounded-full transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="history-content" class="p-6 overflow-y-auto custom-scrollbar flex-1 bg-white">
            </div>
        </div>
    </div>

</div>

<style>
.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.custom-scrollbar::-webkit-scrollbar { width: 6px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
</style>
