<div id="send-broadcast-wrapper" class="w-full max-w-[95rem] mx-auto space-y-4 animate-fade-in pb-24 relative">
    
    <div class="flex items-center justify-between mb-6">
        <div>
            <button onclick="window.location.hash='#campaigns'" class="text-[10px] font-black uppercase tracking-widest text-slate-500 hover:text-blue-600 transition flex items-center gap-2 mb-2">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </button>
            <h2 class="text-xl font-black text-slate-800 flex items-center gap-2 uppercase tracking-tighter">
                <i class="fa-solid fa-rocket text-blue-600"></i> Smart Broadcast Builder
            </h2>
        </div>
        <div class="flex gap-3">
            <button id="btn-send-now" onclick="window.handleSaveCampaign(event)" class="px-8 py-3 bg-slate-900 text-white hover:bg-black rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-xl transition active:scale-95 flex items-center gap-2">
                Launch Campaign <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-7 space-y-4">
            
            <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                <h3 class="text-[11px] font-black text-slate-800 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <span class="w-6 h-6 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-[10px]">1</span>
                    Select Target Audience
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <select id="campAudience" onchange="window.toggleCsvUpload()" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl text-[11px] font-black text-slate-700 outline-none uppercase focus:border-blue-500 transition">
                        <option value="all">All CRM Contacts</option>
                        <option value="hot">Hot Leads Only</option>
                        <option value="past">Past Buyers</option>
                        <option value="csv">Custom CSV Upload</option>
                    </select>
                    <input type="text" id="campName" required placeholder="CAMPAIGN NAME (E.G. DIWALI_PROMO)" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl font-black text-[11px] uppercase outline-none focus:border-blue-500 transition">
                </div>

                <div id="csv-upload-wrapper" class="hidden mt-4 p-4 bg-blue-50/50 border border-dashed border-blue-200 rounded-2xl">
                    <input type="file" id="campCsvFile" accept=".csv" class="block w-full text-[10px] text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-[9px] file:font-black file:uppercase file:bg-blue-600 file:text-white">
                    <p class="text-[8px] font-bold text-blue-400 mt-2 uppercase tracking-widest">Format: Col A: Phone, Col B: Name</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm">
                <h3 class="text-[11px] font-black text-slate-800 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <span class="w-6 h-6 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center text-[10px]">2</span>
                    Choose Approved Template
                </h3>
                
                <div class="space-y-4">
                    <select id="templateSelect" onchange="window.handleTemplateChange()" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl text-[11px] font-black text-slate-700 outline-none uppercase focus:border-emerald-500 transition">
                        <option value="">-- SELECT APPROVED TEMPLATE --</option>
                    </select>

                    <div id="variable-info" class="hidden p-4 bg-slate-50 rounded-2xl border border-slate-100">
                        <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2">Dynamic Mapping</p>
                        <div class="flex items-center gap-3">
                            <span class="px-2 py-1 bg-blue-100 text-blue-600 rounded text-[10px] font-black">{{1}}</span>
                            <span class="text-[10px] font-bold text-slate-600 uppercase tracking-wider">Will be replaced with Customer's Name</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-purple-50 flex items-center justify-center text-purple-600">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div>
                        <h4 class="text-[11px] font-black text-slate-800 uppercase tracking-widest">AI Auto-Responder</h4>
                        <p class="text-[9px] font-bold text-slate-400 uppercase">AI will handle replies for this campaign</p>
                    </div>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="campAiReply" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600 shadow-sm"></div>
                </label>
            </div>
        </div>

        <div class="lg:col-span-5 flex justify-center">
            <div class="sticky top-6 w-full max-w-[320px]">
                <div class="relative w-full h-[580px] bg-slate-900 rounded-[2.8rem] border-[7px] border-slate-800 shadow-2xl overflow-hidden">
                    <div class="absolute inset-0 bg-[#e5ddd5] flex flex-col">
                        <div class="bg-[#075e54] p-3 flex items-center gap-2 text-white">
                            <i class="fa-solid fa-arrow-left text-[10px]"></i>
                            <div class="w-7 h-7 rounded-full bg-white/20"></div>
                            <span class="text-[9px] font-black uppercase tracking-widest" id="preview-biz-name">Chatkun Preview</span>
                        </div>
                        <div class="flex-1 p-3 overflow-y-auto space-y-3">
                            <div class="bg-white rounded-xl rounded-tl-none p-3 shadow-sm max-w-[90%] border-b border-slate-100">
                                <p id="preview-body" class="text-[11px] text-slate-700 leading-normal font-medium italic">Select a template to see preview...</p>
                            </div>
                            <div id="preview-buttons" class="space-y-1 max-w-[90%]"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
