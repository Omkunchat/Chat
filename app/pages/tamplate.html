<div id="templates-dashboard" class="w-full max-w-[95rem] mx-auto space-y-6 animate-fade-in pb-10">
    
    <div class="flex flex-col md:flex-row justify-between items-end md:items-center gap-4 bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm">
        <div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Templates Hub</h1>
            <p class="text-[10px] font-black text-blue-600 uppercase tracking-[0.3em]">Scalable Messaging Engine v2.0</p>
        </div>
        <div class="flex gap-3 w-full md:w-auto">
            <!-- Naya Sync Button -->
            <button id="sync-meta-btn" onclick="window.syncWithMeta()" class="flex-1 md:flex-none bg-slate-900 text-white px-6 py-4 rounded-2xl font-black text-[11px] uppercase tracking-widest shadow-lg hover:shadow-black/20 hover:-translate-y-1 transition-all flex justify-center items-center gap-2">
                <i class="fa-solid fa-rotate text-lg"></i> <span class="hidden md:inline">Sync Meta</span>
            </button>

            <a href="#create-tamplate" class="flex-1 md:flex-none bg-blue-600 text-white px-6 py-4 rounded-2xl font-black text-[11px] uppercase tracking-widest shadow-xl hover:shadow-blue-500/20 hover:-translate-y-1 transition-all flex justify-center items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-lg"></i> <span class="hidden md:inline">Create Template</span>
            </a>
        </div>
    </div>

    <!-- Stats Section -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm relative overflow-hidden group">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Library</p>
            <h3 id="display-total-templates" class="text-3xl font-black text-slate-900 tracking-tight">0</h3>
            <i class="fa-solid fa-box-archive absolute -right-4 -bottom-4 text-4xl text-slate-50 transition-transform group-hover:scale-110"></i>
        </div>

        <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm relative overflow-hidden group">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 text-emerald-500">Approved</p>
            <h3 id="display-approved-templates" class="text-3xl font-black text-emerald-500 tracking-tight">0</h3>
            <i class="fa-solid fa-circle-check absolute -right-4 -bottom-4 text-4xl text-emerald-50/50"></i>
        </div>

        <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm relative overflow-hidden group">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 text-yellow-500">Pending</p>
            <h3 id="display-pending-templates" class="text-3xl font-black text-yellow-500 tracking-tight">0</h3>
            <i class="fa-solid fa-clock-rotate-left absolute -right-4 -bottom-4 text-4xl text-yellow-50/50"></i>
        </div>

        <div class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm relative overflow-hidden group">
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 text-red-500">Rejected</p>
            <h3 id="display-rejected-templates" class="text-3xl font-black text-red-500 tracking-tight">0</h3>
            <i class="fa-solid fa-ban absolute -right-4 -bottom-4 text-4xl text-red-50/50"></i>
        </div>
    </div>

    <!-- Library Section -->
    <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-xl overflow-hidden">
        <div class="p-6 border-b border-slate-50 flex flex-wrap gap-4 items-center justify-between">
            <div class="relative flex-1 min-w-[300px]">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <!-- Added onkeyup -->
                <input type="text" id="search-tpl" onkeyup="window.handleTemplateSearch()" placeholder="SEARCH BY NAME OR CONTENT..." class="w-full pl-14 pr-6 py-4 bg-slate-50 rounded-2xl text-[11px] font-black uppercase tracking-widest outline-none focus:ring-2 ring-blue-500/10 transition">
            </div>
            <!-- Added onchange -->
            <select id="filter-category" onchange="window.handleTemplateSearch()" class="bg-slate-50 border-none rounded-2xl px-6 py-4 text-[11px] font-black uppercase tracking-widest outline-none cursor-pointer">
                <option value="all">All Statuses</option>
                <option value="APPROVED">Approved</option>
                <option value="PENDING">Pending</option>
                <option value="REJECTED">Rejected</option>
            </select>
        </div>

        <!-- Yahan par Cards dynamically render honge -->
        <div id="templates-grid" class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Items rendered via JS -->
        </div>

    </div>
</div>
