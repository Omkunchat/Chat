<div id="templates-dashboard" class="w-full max-w-[95rem] mx-auto space-y-4 animate-fade-in pb-10">
    
    <!-- Premium Header (Compact Padding) -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 bg-white p-5 rounded-[2rem] border border-slate-200 shadow-sm transition-all hover:shadow-md">
        <div>
            <h1 class="text-xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                <i class="fa-solid fa-message-captions text-blue-600"></i> Templates Hub
            </h1>
            <p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.3em] mt-0.5">First Massage Template Mangement</p>
        </div>
        <div class="flex gap-2 w-full md:w-auto mt-2 md:mt-0">
            <button id="sync-meta-btn" onclick="window.syncWithMeta()" class="flex-1 md:flex-none bg-slate-900 text-white px-5 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-2 active:scale-95">
                <i class="fa-solid fa-rotate text-sm"></i> <span class="hidden md:inline">Sync Meta</span>
            </button>
            <a href="#create-tamplate" class="flex-1 md:flex-none bg-blue-600 text-white px-5 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-2 active:scale-95">
                <i class="fa-solid fa-plus text-sm"></i> <span class="hidden md:inline">Create Template</span>
            </a>
        </div>
    </div>

    <!-- Stats Section (Compact Grid) -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <div class="bg-white p-4 rounded-[1.5rem] border border-slate-200 shadow-sm relative overflow-hidden group">
            <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Total Library</p>
            <h3 id="display-total-templates" class="text-2xl font-black text-slate-900 tracking-tight">0</h3>
            <i class="fa-solid fa-folder-tree absolute -right-4 -bottom-4 text-4xl text-slate-50 transition-transform group-hover:scale-110"></i>
        </div>

        <div class="bg-white p-4 rounded-[1.5rem] border border-slate-200 shadow-sm relative overflow-hidden group">
            <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1 text-emerald-500">Approved</p>
            <h3 id="display-approved-templates" class="text-2xl font-black text-emerald-500 tracking-tight">0</h3>
            <i class="fa-solid fa-circle-check absolute -right-4 -bottom-4 text-4xl text-emerald-50/50"></i>
        </div>

        <div class="bg-white p-4 rounded-[1.5rem] border border-slate-200 shadow-sm relative overflow-hidden group">
            <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1 text-yellow-500">Pending</p>
            <h3 id="display-pending-templates" class="text-2xl font-black text-yellow-500 tracking-tight">0</h3>
            <i class="fa-solid fa-clock-rotate-left absolute -right-4 -bottom-4 text-4xl text-yellow-50/50"></i>
        </div>

        <div class="bg-white p-4 rounded-[1.5rem] border border-slate-200 shadow-sm relative overflow-hidden group">
            <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1 text-red-500">Rejected</p>
            <h3 id="display-rejected-templates" class="text-2xl font-black text-red-500 tracking-tight">0</h3>
            <i class="fa-solid fa-ban absolute -right-4 -bottom-4 text-4xl text-red-50/50"></i>
        </div>
    </div>

    <!-- Library Section -->
    <div class="bg-white rounded-[2rem] border border-slate-200 shadow-sm overflow-hidden">
        
        <!-- Filter Header (Scrollable Badges) -->
        <div class="p-4 border-b border-slate-100 flex flex-col gap-4 bg-slate-50/30">
            <!-- Search Bar -->
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-[10px]"></i>
                <input type="text" id="search-tpl" onkeyup="window.handleTemplateSearch()" placeholder="SEARCH TEMPLATES..." class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-[10px] font-black uppercase tracking-widest outline-none focus:ring-2 ring-blue-500/10 transition shadow-inner">
            </div>
            
            <!-- 🚀 FIX: Scrollable Badge Filter Row -->
            <div id="status-filter-badges" class="flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar w-full whitespace-nowrap">
                <button onclick="window.setStatusFilter('all')" class="status-badge active px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-widest transition-all shrink-0">All</button>
                <button onclick="window.setStatusFilter('APPROVED')" class="status-badge text-emerald-600 bg-emerald-50 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-widest transition-all border border-emerald-100 shrink-0">Approved</button>
                <button onclick="window.setStatusFilter('PENDING')" class="status-badge text-yellow-600 bg-yellow-50 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-widest transition-all border border-yellow-100 shrink-0">Pending</button>
                <button onclick="window.setStatusFilter('REJECTED')" class="status-badge text-red-600 bg-red-50 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-widest transition-all border border-red-100 shrink-0">Rejected</button>
            </div>
        </div>

        <!-- Templates Grid (Compact Cards) -->
        <div id="templates-grid" class="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 min-h-[300px]">
            <!-- Items rendered via JS -->
        </div>

    </div>
</div>

<style>
    /* Custom Scrollbar for the filter row to make it neat */
    .custom-scrollbar::-webkit-scrollbar {
        height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent; 
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
    }
    
    .status-badge {
        color: #64748b;
        background-color: #f1f5f9;
        border: 1px solid #e2e8f0;
    }
    .status-badge:hover {
        border-color: #cbd5e1;
    }
    .status-badge.active {
        color: #ffffff;
        background-color: #0f172a; 
        border-color: #0f172a;
    }
</style>
